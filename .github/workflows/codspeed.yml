---
name: Benchmarks

"on":
  push:
    branches: [main]
  pull_request:
  # workflow_dispatch lets CodSpeed backtest history for initial data
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: CodSpeed (cpu + memory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev pkg-config
      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed@6.0.0
      - name: Build the benchmark targets
        run: >-
          cargo codspeed build
          --features logi-mx-driver/codspeed,logi-mx-daemon/codspeed
          -p logi-mx-driver -p logi-mx-daemon
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation,memory
          run: cargo codspeed run
