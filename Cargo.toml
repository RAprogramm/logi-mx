[workspace]
resolver = "3"
members = ["driver", "daemon", "cli", "ui", "overlay"]

[workspace.package]
version = "0.7.1"
edition = "2024"
authors = ["RAprogramm <andrey.rozanov.vl@gmail.com>"]
license = "MIT"
repository = "https://github.com/RAprogramm/logi-mx"
rust-version = "1.99"
publish = false

[workspace.dependencies]
logi-mx-driver = { path = "driver" }
masterror = { version = "0.32", default-features = false, features = ["std"] }
hidapi = { version = "2", default-features = false, features = [
  "linux-native",
] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
udev = "0.9"
evdev = "0.13"
clap = { version = "4", features = ["derive"] }
proptest = "1"
criterion = "0.8"
codspeed-criterion-compat = "6"
gtk4 = { version = "0.11", features = ["v4_14", "v4_24"] }
libadwaita = { version = "0.9", features = ["v1_6", "v1_10"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }
resvg = { version = "0.49", default-features = false }
usvg = { version = "0.49", default-features = false }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
